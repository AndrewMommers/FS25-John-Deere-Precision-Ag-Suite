<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FS25 Precision Ag Dashboard</title>
    <style>
      :root {
        --bg: #101820;
        --panel: #1b2a33;
        --panel-2: #223844;
        --text: #eaf4f4;
        --muted: #9fc7c7;
        --accent: #67d1a5;
        --warn: #f5c96c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .shell {
        max-width: 1200px;
        margin: 32px auto;
        padding: 24px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .status {
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--panel-2);
        color: var(--muted);
        font-size: 0.9rem;
      }

      .status.connected {
        background: rgba(103, 209, 165, 0.15);
        color: var(--accent);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(220px, 1fr));
        gap: 20px;
      }

      .map-panel {
        margin-top: 20px;
        background: var(--panel);
        border-radius: 12px;
        padding: 16px;
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px;
        padding: 18px;
        min-height: 160px;
      }

      canvas {
        width: 100%;
        height: 260px;
        display: block;
        background: linear-gradient(180deg, rgba(103,209,165,0.08), rgba(16,24,32,0.1));
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .label {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        margin-bottom: 10px;
      }

      .value {
        font-size: clamp(1.5rem, 2vw, 2.5rem);
        font-weight: 700;
      }

      button {
        margin-top: 18px;
        background: var(--accent);
        color: #0d1d20;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .log {
        margin-top: 20px;
        background: var(--panel);
        border-radius: 12px;
        padding: 16px;
        min-height: 160px;
      }

      pre {
        margin: 0;
        color: var(--muted);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="header">
        <h1>FS25 Precision Ag Dashboard</h1>
        <div id="connectionStatus" class="status">Connecting...</div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="label">Speed</div>
          <div id="speed" class="value">0.0 km/h</div>
        </div>

        <div class="card">
          <div class="label">Heading</div>
          <div id="heading" class="value">0.0°</div>
        </div>

        <div class="card">
          <div class="label">Steering</div>
          <div id="steering" class="value">0.0°</div>
        </div>

        <div class="card">
          <div class="label">AutoTrac</div>
          <div id="autoTracMode" class="value">Manual</div>
        </div>

        <div class="card">
          <div class="label">Field</div>
          <div id="fieldId" class="value">field_001</div>
        </div>

        <div class="card">
          <div class="label">Cross-track error</div>
          <div id="crossTrackError" class="value">0.0 m</div>
        </div>

        <div class="card">
          <div class="label">Position</div>
          <div id="position" class="value">0, 0</div>
        </div>

        <div class="card">
          <div class="label">Implement</div>
          <div id="implementState" class="value">Lowered</div>
        </div>

        <div class="card">
          <div class="label">Status</div>
          <div id="machineStatus" class="value">Idle</div>
        </div>
      </div>

      <div class="map-panel">
        <div class="label">Field Map</div>
        <canvas id="mapCanvas" width="960" height="260"></canvas>
      </div>

      <button id="toggleAutoTrac">Toggle AutoTrac</button>
      <button id="loadAutoTrac">Load AutoTrac Lines</button>

      <div class="log">
        <div class="label">Event Feed</div>
        <pre id="eventFeed">Waiting for telemetry...</pre>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
